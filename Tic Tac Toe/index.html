<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <style>
        body{
            background:url("/Background.png");
            
        }
#header {
    width: 60vmin;
    margin: 20px auto;      
    display: flex;
    justify-content: center;
    align-items: center;
    color: #9AAAC4;
    border: 5px solid;
    border-radius: 50px;
    border-color: #ff4d6d #00d1ff #ff4d6d #00d1ff;
    min-height: 60px;
    background-color:#080F20;
    padding: 10px;            
}

    .cell{
  height: 18vmin;
  width: 18vmin;
  border-radius: 1rem;
  border: none;
  box-shadow: 0 0 1rem rgba(0, 0, 0, 0.3);
  font-size: 8vmin;
  background-color: #101B35;
      display: flex;
    justify-content: center;
    align-items: center;

}
.board{
    display: grid;
    grid-template-columns: repeat(3, 0.1fr);
    grid-template-rows: repeat(3, 0.1fr);
    gap: 12px;
    justify-content: center;
    align-items: center;
    padding-right:75px;

}
.game{
      display: grid;
  grid-template-columns: auto auto auto;
  margin-top:100px;
}
.score{
    padding-left:350px;
    padding-top: 110px;
    color:#9AAAC4;
}
.playerturn{
    border:5px solid;
    border-color: #ff4d6d #00d1ff #ff4d6d #00d1ff;
    border-radius: 25px;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-top:-50px;
    margin-left:50px;
    margin-bottom:15px;
    width:300px;
}
.playerboard{
    display: grid;
    grid-template-columns: repeat(1,auto);
    grid-template-rows: repeat(2,auto);
    justify-content: center;
    align-items: center;
}

table{
    font-size: 25px;
    text-align: center;
    border:5px solid;
    border-color: #ff4d6d #00d1ff #ff4d6d #00d1ff;
    border-radius: 25px;
    width:300px;
    height: 150px;
    background-color: #080F20;
}
th{
    padding-bottom: 30px;
}
.crossed{
    background-color: #080F20;
    border:3px solid;
}


.gamebtn{
    margin-top:25px;
    display: flex;
    gap: 15px;
    justify-content: center;
    margin-left:-125px;
}
button{
    width:150px;
    height:75px;
    color:#9AAAC4;
    border:3px solid;
    border-radius: 25px;
    border-color: #ff4d6d #00d1ff #ff4d6d #00d1ff;
    background-color:#080F20;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    line-height: 1.2;
}
button span{
    font-size: 12px;
    display: block;
}


    </style>
</head>
<body>
    <h1 id="header">Tic Tac Toe</h1>

    <div class="game">
    <div class="score">
        <table>
            <tr><th>Player</th><th>Score</th></tr>
            <tr><td style="color:#00d1ff">X</td><td id="p1s">0</td></tr>
            <tr><td style="color:#ff4d6d">O</td><td id="p2s">0</td></tr>
        </table>
        <div class="gamebtn">
        <button onclick="newgamebtn()">New Game<br><span>scores will be zero</span></button>
        <button onclick="resetbtn()">Reset Game</button>
        </div>
    </div>
    <div class="playerboard">
    <div class="playerturn">
        <h1 id="playerturn">X turn</h1>
    </div>
        <div class="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>
</div>
    </div>
            
    <script src="app.js" async defer></script>
</body>
</html>
